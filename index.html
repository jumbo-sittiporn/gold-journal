<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#11110f">
<title>Gold Trading Journal v2</title>
<style>
:root{
  --bg:#f4f3ef;--surface:#ffffff;--surface2:#eceae4;--text:#171714;--muted:#6c6b65;--muted2:#9a9890;
  --line:rgba(0,0,0,.11);--line2:rgba(0,0,0,.18);--green:#2f7d32;--greenBg:#e8f4e7;
  --red:#b02d2d;--redBg:#faeaea;--amber:#8c570f;--amberBg:#fbefd9;--blue:#185fa5;--blueBg:#e7f1fb;
  --shadow:0 8px 26px rgba(0,0,0,.06);--r:14px;--r2:10px;--navH:70px;
}
[data-theme="dark"]{
  --bg:#171715;--surface:#21211f;--surface2:#2a2a27;--text:#f3f1ea;--muted:#b0aea5;--muted2:#77756e;
  --line:rgba(255,255,255,.10);--line2:rgba(255,255,255,.18);--green:#76c86c;--greenBg:#172a16;
  --red:#ed7777;--redBg:#301515;--amber:#f0b458;--amberBg:#30230e;--blue:#69aee9;--blueBg:#13263a;
  --shadow:none;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit}
button{touch-action:manipulation}
.app{max-width:1180px;margin:auto;padding:14px 14px calc(var(--navH) + 24px)}
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px;margin-bottom:8px}
.brand h1{font-size:18px;line-height:1.2}.brand p{font-size:12px;color:var(--muted2);margin-top:2px}
.top-actions{display:flex;gap:8px;align-items:center}.iconbtn,.btn{border:1px solid var(--line2);background:var(--surface);color:var(--text);border-radius:10px;padding:9px 12px;cursor:pointer}
.iconbtn{width:40px;height:40px;padding:0;display:grid;place-items:center}.btn.primary{background:var(--text);color:var(--surface);border-color:transparent;font-weight:700}.btn.ghost{background:transparent}.btn.danger{color:var(--red);border-color:var(--red)}
.status-pill{font-size:12px;font-weight:700;padding:7px 10px;border-radius:999px;background:var(--greenBg);color:var(--green);white-space:nowrap}
.status-pill.warn{background:var(--amberBg);color:var(--amber)}.status-pill.stop{background:var(--redBg);color:var(--red)}
.syncbar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;background:var(--blueBg);color:var(--blue);font-size:12px;margin-bottom:12px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:0 0 auto}
.panel{display:none}.panel.on{display:block}.section-title{display:flex;align-items:end;justify-content:space-between;margin:18px 2px 9px}.section-title h2{font-size:13px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}.section-title small{font-size:11px;color:var(--muted2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px;box-shadow:var(--shadow);margin-bottom:12px}.card.flat{box-shadow:none}.card.compact{padding:12px}
.grid{display:grid;gap:10px}.grid.metrics{grid-template-columns:repeat(4,minmax(0,1fr))}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;text-align:center}.metric .n{font-size:24px;font-weight:800;white-space:nowrap}.metric .l{font-size:11px;color:var(--muted2);margin-top:2px}.pos{color:var(--green)!important}.neg{color:var(--red)!important}.amber{color:var(--amber)!important}.blue{color:var(--blue)!important}
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:12px}.hero-main{padding:18px}.hero-main h3{font-size:19px;margin-bottom:5px}.hero-main p{font-size:13px;color:var(--muted)}.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.hardbar{border-radius:12px;padding:13px 14px;font-weight:800;text-align:center;background:var(--greenBg);color:var(--green);margin-bottom:10px}.hardbar.warn{background:var(--amberBg);color:var(--amber)}.hardbar.stop{background:var(--redBg);color:var(--red)}
.progress{height:12px;background:var(--surface2);border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--blue);width:0;transition:width .25s;border-radius:999px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.sticky-save{position:sticky;bottom:calc(var(--navH) + 8px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);padding:8px 0 2px}
.field label{font-size:12px;color:var(--muted);display:block;margin:0 0 5px}.field input,.field select,.field textarea{width:100%;background:var(--surface);color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:10px 11px;outline:none}.field textarea{min-height:72px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 14%,transparent)}
.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:999px;padding:7px 11px;font-size:12px;cursor:pointer;user-select:none}.chip.on{background:var(--blueBg);color:var(--blue);border-color:var(--blue);font-weight:800}.chip.buy.on{background:var(--greenBg);color:var(--green);border-color:var(--green)}.chip.sell.on{background:var(--redBg);color:var(--red);border-color:var(--red)}.chip.bad.on{background:var(--redBg);color:var(--red);border-color:var(--red)}
.form-block{margin-bottom:13px}.form-block>label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.mini-info{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.mini-pill{font-size:11px;padding:5px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.checkline{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.checkline:last-child{border-bottom:none}.checkmark{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--redBg);color:var(--red);font-size:11px;font-weight:900}.checkmark.ok{background:var(--greenBg);color:var(--green)}
.logitem{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;background:var(--surface)}.loghead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.logtitle{font-weight:800}.logmeta{font-size:11px;color:var(--muted2);margin-top:2px}.logpnl{font-weight:900;white-space:nowrap}.tagrow{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{font-size:10px;padding:3px 7px;border-radius:999px;background:var(--surface2);color:var(--muted)}.note{font-size:12px;color:var(--muted);margin-top:7px;white-space:pre-wrap;word-break:break-word}.empty{padding:34px 16px;text-align:center;color:var(--muted2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters select,.filters input{background:var(--surface);border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:8px 10px;font-size:12px}
.statrow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}.statrow:last-child{border-bottom:none}.statrow span:first-child{color:var(--muted)}.statrow strong{font-weight:800}
.baritem{margin-bottom:11px}.barhead{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}.barhead span:first-child{color:var(--muted)}.bartrack{height:9px;background:var(--surface2);border-radius:999px;overflow:hidden}.barfill{height:100%;background:var(--blue);border-radius:999px}
.equity{width:100%;height:170px;display:block;background:linear-gradient(to bottom,transparent, color-mix(in srgb,var(--blueBg) 45%,transparent));border-radius:10px;border:1px solid var(--line)}
.callout{padding:12px 13px;border-radius:10px;background:var(--blueBg);color:var(--blue);font-size:13px}.callout.warn{background:var(--amberBg);color:var(--amber)}.callout.stop{background:var(--redBg);color:var(--red)}
.rule{border-left:4px solid var(--green);padding-left:11px;margin-bottom:12px}.rule.warn{border-color:var(--amber)}.rule.stop{border-color:var(--red)}.rule h4{font-size:14px}.rule p{font-size:12px;color:var(--muted);margin-top:3px}
.nav{position:fixed;bottom:0;left:0;right:0;height:var(--navH);z-index:50;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}.navin{width:min(100%,780px);display:grid;grid-template-columns:repeat(6,1fr)}.navbtn{border:0;background:transparent;color:var(--muted2);font-size:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}.navbtn .ico{font-size:19px;line-height:1}.navbtn.on{color:var(--blue);font-weight:800}
.toast{position:fixed;left:50%;bottom:calc(var(--navH) + 18px);transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}.modal.on{display:flex}.sheet{width:min(100%,720px);max-height:90vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheethead h3{font-size:17px}.close{border:0;background:var(--surface2);color:var(--text);width:34px;height:34px;border-radius:50%;cursor:pointer}
.loading{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center}.loader{text-align:center;color:var(--muted)}.spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 10px}@keyframes spin{to{transform:rotate(360deg)}}
.desktop-tabs{display:none}
@media(max-width:760px){
  .app{padding:10px 10px calc(var(--navH) + 18px)}.grid.metrics{grid-template-columns:repeat(2,1fr)}.grid.three{grid-template-columns:1fr 1fr}.hero,.quick-grid,.grid.two{grid-template-columns:1fr}.metric .n{font-size:21px}.topbar{padding-top:6px}.brand p{display:none}.status-pill{font-size:11px}.card{padding:13px}.sticky-save{bottom:calc(var(--navH) + 4px)}
}
@media(min-width:900px){
  .nav{display:none}.app{padding-bottom:36px}.desktop-tabs{display:flex;gap:7px;margin:4px 0 14px;position:sticky;top:61px;z-index:25;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);padding:8px 0}.desktop-tabs button{border:1px solid var(--line2);background:transparent;color:var(--muted);border-radius:999px;padding:8px 13px;cursor:pointer}.desktop-tabs button.on{background:var(--text);color:var(--surface);border-color:transparent}.sticky-save{bottom:8px}
}
</style>
</head>
<body>
<div class="loading" id="loading"><div class="loader"><div class="spinner"></div><div id="loadingTxt">กำลังโหลด Trading Journal...</div></div></div>
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="brand"><h1>Gold Trading Journal <span style="color:var(--blue)">v2</span></h1><p>XAU/USD · ใช้ข้อมูลมาก แต่บันทึกให้น้อยคลิก</p></div>
    <div class="top-actions"><span class="status-pill" id="topStatus">เทรดได้</span><button class="iconbtn" id="themeBtn" aria-label="สลับธีม">◐</button></div>
  </header>

  <div class="desktop-tabs" id="desktopTabs"></div>
  <div class="syncbar" id="syncBar"><span class="dot"></span><span id="syncText">พร้อมใช้งาน</span></div>

  <main>
    <section class="panel on" id="panel-dashboard"></section>
    <section class="panel" id="panel-trade"></section>
    <section class="panel" id="panel-history"></section>
    <section class="panel" id="panel-analytics"></section>
    <section class="panel" id="panel-risk"></section>
    <section class="panel" id="panel-settings"></section>
  </main>
</div>

<nav class="nav"><div class="navin" id="mobileNav"></div></nav>
<div class="toast" id="toast"></div>
<div class="modal" id="detailModal"><div class="sheet"><div class="sheethead"><h3>รายละเอียดเทรด</h3><button class="close" data-close-modal>×</button></div><div id="detailBody"></div></div></div>
<input type="file" id="importFile" accept="application/json" hidden>

<script>
'use strict';

let API_URL = localStorage.getItem('gtj2_api_url') || 'https://script.google.com/macros/s/AKfycbySlwCan9V8bgAMrgdrXJVfsWViAn2mNUBW1tQRySVJMhmJbYEXuro0xDnjvwpc0XPXoA/exec';
const TZ = 'Asia/Bangkok';
const META_MARK = '__GTJ_META__';
const LS = {
  entries:'gtj2_entries', pending:'gtj2_pending', settings:'gtj2_settings', theme:'gtj2_theme', tab:'gtj2_tab', apiUrl:'gtj2_api_url'
};

const DEFAULT_SETTINGS = {
  accountSize:120, riskPct:1, contractSize:100, leverage:100, lotStep:0.01, defaultLot:0.01,
  warnLoss:6, maxDailyLoss:10, maxTrades:5, maxConsecutiveLoss:3, profitLock:20,
  monthlyTargetThb:15000, fxRate:32.75, minRR:1.5
};

const state = {
  tab:'dashboard', entries:[], pending:[], settings:{...DEFAULT_SETTINGS},
  daily:{pnl:0,trades:0,wins:0,losses:0,consecutiveLoss:0},
  form:{dir:'BUY',setup:'Pullback',tf:'M15',session:autoSession(),plan:'ตามแผน',emotion:'สงบ',tags:[]},
  filters:{result:'ALL',setup:'ALL',plan:'ALL'}
};

const NAVS = [
  ['dashboard','⌂','วันนี้'],['trade','＋','บันทึก'],['history','☷','ประวัติ'],
  ['analytics','▥','สถิติ'],['risk','◉','Risk'],['settings','⚙','ตั้งค่า']
];
const SETUPS=['Pullback','Breakout','Reversal','VWAP','Range','News'];
const TFS=['M5','M15','M30','H1'];
const SESSIONS=['Asia','London','New York'];
const EMOTIONS=['สงบ','มั่นใจ','กังวล','โลภ','โกรธ/หัวร้อน','revenge'];
const QUICK_TAGS=['รอแท่งยืนยัน','เข้าเร็วเกิน','FOMO','ขยับ SL','ปิดเร็ว','ตามแผนดี','สวนเทรนด์','ข่าวแรง'];

function $(id){return document.getElementById(id)}
function q(sel,root=document){return root.querySelector(sel)}
function qa(sel,root=document){return [...root.querySelectorAll(sel)]}
function num(v){const n=parseFloat(v);return Number.isFinite(n)?n:0}
function money(v,d=2){const n=num(v);return `${n>=0?'+':''}$${n.toFixed(d)}`}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function uid(){return `t_${Date.now()}_${Math.random().toString(36).slice(2,8)}`}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)}
function nowParts(){
  const parts=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const o={};parts.forEach(p=>o[p.type]=p.value);return o;
}
function todayKey(){const p=nowParts();return `${p.year}-${p.month}-${p.day}`}
function displayDate(d=new Date()){return new Intl.DateTimeFormat('th-TH',{timeZone:TZ,day:'numeric',month:'short',year:'2-digit'}).format(d)}
function displayDateShort(d=new Date()){return new Intl.DateTimeFormat('th-TH',{timeZone:TZ,day:'numeric',month:'short'}).format(d)}
function displayTime(d=new Date()){return new Intl.DateTimeFormat('th-TH',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
function autoSession(){const h=Number(nowParts().hour);return h>=6&&h<15?'Asia':h>=15&&h<21?'London':'New York'}
function isBadEmotion(e){return e==='revenge'||e==='โกรธ/หัวร้อน'}
function safeB64Encode(obj){try{return btoa(unescape(encodeURIComponent(JSON.stringify(obj))))}catch{return ''}}
function safeB64Decode(s){try{return JSON.parse(decodeURIComponent(escape(atob(s))))}catch{return {}}}
function packReason(reason,meta){return `${reason||''}\n\n${META_MARK}${safeB64Encode(meta)}`.trim()}
function unpackReason(raw=''){
  const i=String(raw).lastIndexOf(META_MARK);if(i<0)return {reason:String(raw),meta:{}};
  return {reason:String(raw).slice(0,i).trim(),meta:safeB64Decode(String(raw).slice(i+META_MARK.length).trim())};
}
function hashOld(e){return `old_${[e.date,e.time,e.dir,e.entry,e.pnl].join('|')}`}
function resultFromPnl(p){return p>0?'Win':p<0?'Loss':'Breakeven'}
function clamp(v,a,b){return Math.min(b,Math.max(a,v))}
function floorStep(v,step){if(!step)return v;return Math.floor((v+1e-12)/step)*step}

function saveLocal(){
  localStorage.setItem(LS.entries,JSON.stringify(state.entries));
  localStorage.setItem(LS.pending,JSON.stringify(state.pending));
  localStorage.setItem(LS.settings,JSON.stringify(state.settings));
}
function loadLocal(){
  try{state.entries=JSON.parse(localStorage.getItem(LS.entries)||'[]')}catch{}
  try{state.pending=JSON.parse(localStorage.getItem(LS.pending)||'[]')}catch{}
  try{state.settings={...DEFAULT_SETTINGS,...JSON.parse(localStorage.getItem(LS.settings)||'{}')}}catch{}
  state.tab=localStorage.getItem(LS.tab)||'dashboard';
}

function normalizeApiUrl(url){
  const u=String(url||'').trim();
  if(!u)return '';
  return u.replace(/\/dev\/?$/,'/exec').replace(/\/$/,'');
}
async function parseApiResponse(r){
  const text=await r.text();
  if(!r.ok)throw new Error(`HTTP ${r.status}: ${text.slice(0,120)}`);
  try{return JSON.parse(text)}catch{throw new Error(`ปลายทางไม่ได้ตอบ JSON: ${text.slice(0,120)}`)}
}
async function apiGet(action){
  const base=normalizeApiUrl(API_URL);
  if(!base)throw new Error('ยังไม่ได้ตั้งค่า Web App URL');
  const sep=base.includes('?')?'&':'?';
  const r=await fetch(`${base}${sep}action=${encodeURIComponent(action)}&_=${Date.now()}`,{method:'GET',redirect:'follow',cache:'no-store'});
  return parseApiResponse(r);
}
async function apiPost(data){
  const base=normalizeApiUrl(API_URL);
  if(!base)throw new Error('ยังไม่ได้ตั้งค่า Web App URL');
  const r=await fetch(base,{method:'POST',redirect:'follow',cache:'no-store',body:JSON.stringify(data)});
  return parseApiResponse(r);
}
async function testSheetsConnection(){
  const input=$('sApiUrl');
  const candidate=normalizeApiUrl(input?input.value:API_URL);
  if(!candidate){toast('กรุณาวาง Web App URL');return}
  API_URL=candidate;localStorage.setItem(LS.apiUrl,API_URL);
  const box=$('apiTestResult');
  if(box){box.className='callout';box.textContent='กำลังทดสอบการเชื่อมต่อ...'}
  try{
    let d;
    try{d=await apiGet('ping')}catch{d=await apiGet('getSettings')}
    if(!d||d.status!=='ok')throw new Error(d?.message||'ปลายทางตอบกลับ แต่ status ไม่ใช่ ok');
    if(box){box.className='callout good';box.textContent='เชื่อมต่อ Google Sheets สำเร็จ ✓'}
    syncUI('ok','เชื่อมต่อ Google Sheets สำเร็จ ✓');toast('เชื่อมต่อสำเร็จ');
    await refreshRemote(false);
  }catch(err){
    if(box){box.className='callout bad';box.textContent='เชื่อมต่อไม่สำเร็จ: '+err.message}
    syncUI('err','เชื่อมต่อ Sheets ไม่สำเร็จ');toast('ตรวจสอบ Deployment และสิทธิ์ Anyone');
  }
}
function syncUI(type,msg){const b=$('syncBar');b.style.background=type==='ok'?'var(--greenBg)':type==='err'?'var(--redBg)':type==='warn'?'var(--amberBg)':'var(--blueBg)';b.style.color=type==='ok'?'var(--green)':type==='err'?'var(--red)':type==='warn'?'var(--amber)':'var(--blue)';$('syncText').textContent=msg}

function normalizeRow(r){
  const up=unpackReason(String(r[7]||''));
  const meta=up.meta||{};
  const e={
    id:meta.id||'',date:String(r[0]||''),time:String(r[1]||''),dir:String(r[2]||''),res:String(r[3]||''),
    entry:String(r[4]||''),pnl:String(r[5]||''),emotion:String(r[6]||'-'),reason:up.reason,learn:String(r[8]||''),
    exit:meta.exit||'',sl:meta.sl||'',tp:meta.tp||'',lot:meta.lot||'',setup:meta.setup||'ไม่ระบุ',tf:meta.tf||'-',
    session:meta.session||'-',plan:meta.plan||'ไม่ระบุ',tags:Array.isArray(meta.tags)?meta.tags:[],r:meta.r??'',plannedRR:meta.plannedRR??'',
    dateKey:meta.dateKey||'',iso:meta.iso||'',synced:true
  };
  if(!e.id)e.id=hashOld(e);return e;
}
function mergeEntries(remote,local){
  const m=new Map();[...local,...remote].forEach(e=>m.set(e.id,e));
  return [...m.values()].sort((a,b)=>(b.iso||`${b.date} ${b.time}`).localeCompare(a.iso||`${a.date} ${a.time}`));

function deriveDaily(){

  });

  rows.slice().reverse().forEach(e=>{const p=num(e.pnl);pnl+=p;if(p>0){w++;cons=0}else if(p<0){l++;cons++;maxCons=Math.max(maxCons,cons)}else cons=0});

function calcStats(rows=state.entries){

  $('panel-analytics').innerHTML=`
    <div class="section-title"><h2>Performance Analytics</h2><small>ดูผลลัพธ์และคุณภาพกระบวนการพร้อมกัน</small></div>
    <div class="grid metrics"><div class="metric"><div class="n ${s.net>=0?'pos':'neg'}">${money(s.net,0)}</div><div class="l">Net P&L</div></div><div class="metric"><div class="n">${s.wr.toFixed(0)}%</div><div class="l">Win rate</div></div><div class="metric"><div class="n">${s.pf===Infinity?'∞':s.pf.toFixed(2)}</div><div class="l">Profit factor</div></div><div class="metric"><div class="n ${s.expectancy>=0?'pos':'neg'}">${money(s.expectancy)}</div><div class="l">Expectancy / trade</div></div></div>
    <div class="grid two" style="margin-top:12px"><div class="card"><div style="font-weight:800;margin-bottom:10px">Equity curve</div>${equitySvg(state.entries)}</div><div class="card"><div style="font-weight:800;margin-bottom:8px">สถิติหลัก</div><div class="statrow"><span>Average win</span><strong class="pos">${money(s.avgWin)}</strong></div><div class="statrow"><span>Average loss</span><strong class="neg">-$${s.avgLoss.toFixed(2)}</strong></div><div class="statrow"><span>Average R</span><strong>${s.avgR.toFixed(2)}</strong></div><div class="statrow"><span>Max drawdown</span><strong class="neg">${money(s.maxDD)}</strong></div><div class="statrow"><span>Discipline score</span><strong>${disciplineScore()}%</strong></div></div></div>
    <div class="callout" style="margin-bottom:12px"><strong>Insight:</strong> ${escapeHtml(insightText())}</div>
    <div class="grid three"><div class="card"><div style="font-weight:800;margin-bottom:10px">P&L by Setup</div>${barList(groupStats('setup'))}</div><div class="card"><div style="font-weight:800;margin-bottom:10px">P&L by Session</div>${barList(groupStats('session'))}</div><div class="card"><div style="font-weight:800;margin-bottom:10px">P&L by Emotion</div>${barList(groupStats('emotion'))}</div></div>`;
}

function calcLotSize(){
  const port=num($('rPort')?.value)||state.settings.accountSize,riskPct=num($('rRisk')?.value)||state.settings.riskPct,entry=num($('rEntry')?.value),sl=num($('rSL')?.value),lev=num($('rLev')?.value)||state.settings.leverage;
  const riskUsd=port*riskPct/100,dist=Math.abs(entry-sl),raw=dist?riskUsd/(dist*state.settings.contractSize):0,lot=floorStep(raw,state.settings.lotStep),maxLoss=dist*state.settings.contractSize*lot,margin=entry&&lot?entry*state.settings.contractSize*lot/lev:0;
  return {port,riskPct,entry,sl,lev,riskUsd,dist,raw,lot,maxLoss,margin};
}
function updateLotCalc(){if(!$('lotResult'))return;const c=calcLotSize();$('lotResult').innerHTML=`<div class="grid metrics"><div class="metric"><div class="n blue">${c.lot.toFixed(3)}</div><div class="l">Lot แนะนำ</div></div><div class="metric"><div class="n neg">$${c.maxLoss.toFixed(2)}</div><div class="l">ขาดทุนตาม SL</div></div><div class="metric"><div class="n">$${c.margin.toFixed(2)}</div><div class="l">Margin โดยประมาณ</div></div><div class="metric"><div class="n">$${c.dist.toFixed(2)}</div><div class="l">ระยะ SL</div></div></div><div class="callout ${c.riskPct>2?'stop':c.riskPct>1?'warn':''}" style="margin-top:10px">Risk budget = $${c.riskUsd.toFixed(2)} · Contract size ${state.settings.contractSize} oz/lot · Lot step ${state.settings.lotStep}</div>`}
function renderRisk(){
  const h=hardStopState(),d=state.daily,s=state.settings;
  $('panel-risk').innerHTML=`
    <div class="section-title"><h2>Risk Control</h2><small>คำนวณจากระยะราคา ไม่ใช้ pip value แบบตายตัว</small></div>
    <div class="hardbar ${h.level==='safe'?'':h.level}">${h.text}</div>
    <div class="grid two"><div class="card"><div style="font-weight:800;margin-bottom:10px">Lot Size Calculator — XAU/USD</div><div class="grid two"><div class="field"><label>Account ($)</label><input id="rPort" type="number" value="${s.accountSize}" step="10"></div><div class="field"><label>Risk (%)</label><input id="rRisk" type="number" value="${s.riskPct}" step="0.1"></div><div class="field"><label>Entry price</label><input id="rEntry" type="number" step="0.01" placeholder="เช่น 4040"></div><div class="field"><label>Stop Loss price</label><input id="rSL" type="number" step="0.01" placeholder="เช่น 4028"></div><div class="field"><label>Leverage</label><input id="rLev" type="number" value="${s.leverage}" step="10"></div></div><div id="lotResult" style="margin-top:12px"></div></div>
    <div class="card"><div style="font-weight:800;margin-bottom:10px">วันนี้ใช้ความเสี่ยงเท่าไร</div><div class="statrow"><span>P&L วันนี้</span><strong class="${d.pnl>=0?'pos':'neg'}">${money(d.pnl)}</strong></div><div class="statrow"><span>จำนวนเทรด</span><strong>${d.trades}/${s.maxTrades}</strong></div><div class="statrow"><span>Loss streak</span><strong>${d.consecutiveLoss}/${s.maxConsecutiveLoss}</strong></div><div class="statrow"><span>Daily max loss</span><strong>$${s.maxDailyLoss}</strong></div><div class="statrow"><span>Profit lock</span><strong>$${s.profitLock}</strong></div></div></div>
    <div class="section-title"><h2>Hard Stop Rules</h2></div><div class="card"><div class="rule stop"><h4>ขาดทุนถึง -$${s.maxDailyLoss} → หยุดทันที</h4><p>ห้ามเพิ่ม Lot เพื่อเอาคืน และห้ามเปิดออเดอร์ใหม่</p></div><div class="rule warn"><h4>ขาดทุนถึง -$${s.warnLoss} → ลด Lot ครึ่งหนึ่ง</h4><p>พักอย่างน้อย 15 นาที ก่อนประเมิน Setup ใหม่</p></div><div class="rule stop"><h4>แพ้ติดกัน ${s.maxConsecutiveLoss} ครั้ง → หยุดทันที</h4><p>ตลาดหรือสภาวะอารมณ์ไม่เหมาะกับระบบในวันนี้</p></div><div class="rule"><h4>ครบ ${s.maxTrades} เทรด → จบวัน</h4><p>จำกัด Overtrading และลดการตัดสินใจที่คุณภาพตก</p></div><div class="rule"><h4>กำไรถึง $${s.profitLock} → Profit Lock</h4><p>รักษาวันที่ดีไว้ ไม่คืนกำไรให้ตลาด</p></div></div>`;
  ['rPort','rRisk','rEntry','rSL','rLev'].forEach(id=>$(id).addEventListener('input',updateLotCalc));updateLotCalc();
}

function settingsField(id,label,value,step='1'){return `<div class="field"><label>${label}</label><input id="${id}" type="number" value="${value}" step="${step}"></div>`}
function renderSettings(){const s=state.settings;
  $('panel-settings').innerHTML=`
    <div class="section-title"><h2>Settings</h2><small>ค่าพื้นฐานถูกตั้งแบบอนุรักษ์นิยม ปรับได้ตามบัญชีจริง</small></div>
    <div class="grid two"><div class="card"><div style="font-weight:800;margin-bottom:10px">บัญชีและ Position sizing</div><div class="grid two">${settingsField('sAccount','Account size ($)',s.accountSize,'10')}${settingsField('sRisk','Risk / trade (%)',s.riskPct,'0.1')}${settingsField('sContract','Contract size (oz/lot)',s.contractSize,'1')}${settingsField('sLeverage','Leverage',s.leverage,'10')}${settingsField('sLotStep','Lot step',s.lotStep,'0.001')}${settingsField('sDefaultLot','Default lot',s.defaultLot,'0.001')}${settingsField('sMinRR','Minimum planned R:R',s.minRR,'0.1')}</div></div>
    <div class="card"><div style="font-weight:800;margin-bottom:10px">Hard Stop</div><div class="grid two">${settingsField('sWarn','Warning loss ($)',s.warnLoss,'1')}${settingsField('sMaxLoss','Max daily loss ($)',s.maxDailyLoss,'1')}${settingsField('sMaxTrades','Max trades / day',s.maxTrades,'1')}${settingsField('sMaxCons','Max consecutive loss',s.maxConsecutiveLoss,'1')}${settingsField('sProfitLock','Profit lock ($)',s.profitLock,'1')}</div></div></div>
    <div class="card"><div style="font-weight:800;margin-bottom:10px">เชื่อมต่อ Google Sheets</div><div class="field"><label>Apps Script Web App URL (/exec)</label><input id="sApiUrl" type="url" value="${escapeHtml(API_URL)}" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url"></div><div class="hero-actions" style="margin-top:10px"><button class="btn primary" data-action="testConnection">ทดสอบการเชื่อมต่อ</button><button class="btn" data-action="syncNow">Sync ตอนนี้</button></div><div id="apiTestResult" class="callout warn" style="margin-top:12px">ต้องใช้ URL จาก Deploy → New deployment → Web app และสิทธิ์ Who has access: Anyone</div></div>
    <div class="card"><div style="font-weight:800;margin-bottom:10px">ข้อมูลและการสำรอง</div><div class="hero-actions"><button class="btn primary" data-action="saveSettings">บันทึกการตั้งค่า</button><button class="btn" data-action="exportJson">Backup JSON</button><button class="btn" data-action="importJson">Import JSON</button><button class="btn danger" data-action="resetToday">รีเซ็ตสถิติวันนี้</button></div><div class="callout warn" style="margin-top:12px">สูตร Lot Size ใช้ Contract size ของ XAU/USD โดยตรง ค่าเริ่มต้น 100 oz/lot แต่ต้องตรวจสอบ Contract Specification ของโบรกเกอร์ก่อนใช้งานจริง</div></div>`;
}
function saveSettingsFromForm(){
  const map={accountSize:'sAccount',riskPct:'sRisk',contractSize:'sContract',leverage:'sLeverage',lotStep:'sLotStep',defaultLot:'sDefaultLot',minRR:'sMinRR',warnLoss:'sWarn',maxDailyLoss:'sMaxLoss',maxTrades:'sMaxTrades',maxConsecutiveLoss:'sMaxCons',profitLock:'sProfitLock'};
  Object.entries(map).forEach(([k,id])=>state.settings[k]=num($(id).value));
  if($('sApiUrl')){API_URL=normalizeApiUrl($('sApiUrl').value);localStorage.setItem(LS.apiUrl,API_URL)}
  saveLocal();
  Object.entries(state.settings).forEach(([key,value])=>apiPost({action:'saveSetting',key:`v2_${key}`,value}).catch(()=>{}));
  toast('บันทึกการตั้งค่าแล้ว');renderAll();
}

function exportCsv(){
  const head=['date','time','direction','result','entry','exit','sl','tp','lot','pnl','R','plannedRR','setup','timeframe','session','plan','emotion','tags','reason','learn'];
  const rows=filteredEntries().map(e=>[e.date,e.time,e.dir,e.res,e.entry,e.exit,e.sl,e.tp,e.lot,e.pnl,e.r,e.plannedRR,e.setup,e.tf,e.session,e.plan,e.emotion,(e.tags||[]).join('|'),e.reason,e.learn]);
  const csv=[head,...rows].map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),'gold-trading-journal.csv');
}
function exportJson(){downloadBlob(new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),settings:state.settings,entries:state.entries},null,2)],{type:'application/json'}),'gold-trading-journal-backup.json')}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importJson(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.entries))throw 0;state.entries=mergeEntries(d.entries,state.entries);if(d.settings)state.settings={...state.settings,...d.settings};saveLocal();renderAll();toast('Import สำเร็จ')}catch{toast('ไฟล์ไม่ถูกต้อง')}};r.readAsText(file)}
async function resetToday(){
  if(!confirm('รีเซ็ตตัวนับ Hard Stop ตั้งแต่เวลานี้ใช่หรือไม่? ประวัติเทรดยังอยู่'))return;
  localStorage.setItem(`gtj2_reset_${todayKey()}`,new Date().toISOString());
  state.daily={pnl:0,trades:0,wins:0,losses:0,consecutiveLoss:0};
  await apiPost({action:'saveDaily',date:todayKey(),pnl:0,trades:0,wins:0,losses:0,consloss:0}).catch(()=>{});
  toast('รีเซ็ตตัวนับตั้งแต่เวลานี้แล้ว');renderAll();
}

function bindGlobal(){
  document.addEventListener('click',e=>{
    const tab=e.target.closest('[data-tab]');if(tab){switchTab(tab.dataset.tab);return}
    const go=e.target.closest('[data-go]');if(go){switchTab(go.dataset.go);return}
    const chip=e.target.closest('.chip');if(chip){
      const group=chip.closest('[data-chip-group]')?.dataset.chipGroup,val=chip.dataset.value;if(!group)return;
      if(group==='tags'){const i=state.form.tags.indexOf(val);i>=0?state.form.tags.splice(i,1):state.form.tags.push(val);chip.classList.toggle('on');return}
      state.form[group]=val;qa('.chip',chip.parentElement).forEach(x=>x.classList.toggle('on',x===chip));
      if(group==='dir'){qa('.chip',chip.parentElement).forEach(x=>x.classList.remove('buy','sell'));chip.classList.add(val==='BUY'?'buy':'sell');updateTradeCalc()}
      if(group==='emotion'&&isBadEmotion(val))chip.classList.add('bad');
      updateTradeCalc();return;
    }
    const item=e.target.closest('[data-entry-id]');if(item){const en=state.entries.find(x=>x.id===item.dataset.entryId);if(en){$('detailBody').innerHTML=detailHtml(en);$('detailModal').classList.add('on')}return}
    if(e.target.closest('[data-close-modal]')||e.target===$('detailModal')){$('detailModal').classList.remove('on');return}
    const act=e.target.closest('[data-action]')?.dataset.action;
    if(act==='refresh')refreshRemote(true);if(act==='exportCsv')exportCsv();if(act==='exportJson')exportJson();if(act==='importJson')$('importFile').click();if(act==='syncNow')flushQueue();if(act==='testConnection')testSheetsConnection();if(act==='saveSettings')saveSettingsFromForm();if(act==='resetToday')resetToday();
  });
  document.addEventListener('change',e=>{
    if(e.target.id==='filterResult'){state.filters.result=e.target.value;renderHistory()}
    if(e.target.id==='filterSetup'){state.filters.setup=e.target.value;renderHistory()}
    if(e.target.id==='filterPlan'){state.filters.plan=e.target.value;renderHistory()}
  });
  document.addEventListener('click',e=>{if(e.target.id==='saveTradeBtn')saveTrade()});
  $('themeBtn').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme==='dark';applyTheme(!dark)});
  $('importFile').addEventListener('change',e=>e.target.files[0]&&importJson(e.target.files[0]));
  window.addEventListener('online',()=>flushQueue());window.addEventListener('offline',()=>syncUI('warn','ออฟไลน์ — ระบบจะเก็บข้อมูลไว้ในเครื่อง'));
}
function applyTheme(dark){document.documentElement.dataset.theme=dark?'dark':'';localStorage.setItem(LS.theme,dark?'dark':'light')}

async function refreshRemote(showToast=false){
  syncUI('loading','กำลังดึงข้อมูลจาก Google Sheets...');
  try{
    const [cfg,daily,trades]=await Promise.all([apiGet('getSettings'),apiGet('getDaily'),apiGet('getTrades')]);
    if(cfg.status==='ok'&&cfg.settings){const v2={};Object.entries(cfg.settings).forEach(([k,v])=>{if(k.startsWith('v2_'))v2[k.slice(3)]=num(v)});state.settings={...state.settings,...v2}}
    if(trades.status==='ok'){const remote=(trades.rows||[]).map(normalizeRow);state.entries=mergeEntries(remote,state.entries)}
    if(daily.status==='ok'&&daily.found){state.daily={pnl:num(daily.pnl),trades:num(daily.trades),wins:num(daily.wins),losses:num(daily.losses),consecutiveLoss:num(daily.consloss)}}
    saveLocal();deriveDaily();syncUI('ok',state.pending.length?`โหลดแล้ว · รอ Sync ${state.pending.length} รายการ`:'ข้อมูลล่าสุดจาก Google Sheets ✓');renderAll();if(showToast)toast('อัปเดตข้อมูลแล้ว');await flushQueue();
  }catch(err){deriveDaily();syncUI('warn','เชื่อมต่อ Sheets ไม่ได้ — '+(err?.message||'ใช้ข้อมูลในเครื่อง'));renderAll();if(showToast)toast('ใช้ข้อมูล Offline')}
}

async function init(){
  loadLocal();const theme=localStorage.getItem(LS.theme);applyTheme(theme?theme==='dark':window.matchMedia?.('(prefers-color-scheme: dark)').matches);
  bindGlobal();renderAll();switchTab(NAVS.some(x=>x[0]===state.tab)?state.tab:'dashboard');$('loading').style.display='none';$('app').hidden=false;
  await refreshRemote(false);
}
init();
</script>
